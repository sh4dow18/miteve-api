# Current Execution
spring.jpa.hibernate.ddl-auto = update
# Spring Configuration
# USER, DATABASE_IP, DATABASE and PASSWORD are Environment Variables
spring.application.name=miteve-api
spring.datasource.driver-class-name = org.postgresql.Driver
spring.datasource.username = ${USER}
spring.datasource.url = jdbc:postgresql://${DATABASE_IP}:5432/${DATABASE}
spring.datasource.password = ${PASSWORD}
spring.jpa.database-platform = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql = true
# API
access=new-api
server.port=${PORT}
# Endpoints
endpoint.containers=${access}/containers
endpoint.contents=${access}/contents
endpoint.episodes=${access}/episodes
endpoint.utils=${access}/utils
endpoint.genres=${access}/genres
endpoint.seasons=${access}/seasons
endpoint.users=${access}/users
endpoint.profiles=${access}/profiles
endpoint.continue-watching=${access}/continue-watching
endpoint.history=${access}/history
endpoint.comments=${access}/comments
endpoint.bug-reports=${access}/bug-reports
endpoint.suggested-content-reports=${access}/suggested-content-reports
endpoint.roles=${access}/roles
endpoint.privileges=${access}/privileges
endpoint.scrape=${access}/scrape
# TMDB
tmdb.api-key=${TMDB_API_KEY:10923b261ba94d897ac6b81148314a3f}
lamovie.base-url=https://lamovie.org
lamovie.fast-api=https://lamovie.org/wp-api/v1
lamovie.la.base-url=https://lamovie.la
lamovie.la.fast-api=https://lamovie.la/wp-api/v1
lamovie.download-dir=${LAMOVIE_DOWNLOAD_DIR:./downloads}
# Anime Latino Fallback Providers (en orden: lamovie.la -> jkanime -> latanime -> monoschinos -> tioanime -> animefenix -> animeflv -> consumet -> nyaa)
jkanime.base-url=${JKANIME_BASE_URL:https://jkanime.net}
jkanime.api=${JKANIME_API:https://jkanime.net}
jkanime.enabled=${JKANIME_ENABLED:true}
latanime.base-url=${LATANIME_BASE_URL:https://latanime.org}
latanime.enabled=${LATANIME_ENABLED:true}
monoschinos.base-url=${MONOSCHINOS_BASE_URL:https://monoschinos2.com}
monoschinos.api=${MONOSCHINOS_API:https://monoschinos2.com}
monoschinos.enabled=${MONOSCHINOS_ENABLED:true}
tioanime.base-url=${TIOANIME_BASE_URL:https://tioanime.com}
tioanime.enabled=${TIOANIME_ENABLED:true}
animefenix.base-url=${ANIMEFENIX_BASE_URL:https://animefenix.com}
animefenix.enabled=${ANIMEFENIX_ENABLED:true}
animeflv.base-url=${ANIMEFLV_BASE_URL:https://animeflv.net}
animeflv.api=${ANIMEFLV_API:https://animeflv.net}
animeflv.enabled=${ANIMEFLV_ENABLED:true}
animeflv.ahmedr.api=${ANIMEFLV_AHMEDR_API:https://animeflv.ahmedr.net/api}
consumet.api=${CONSUMET_API:https://api.consumet.org}
consumet.enabled=${CONSUMET_ENABLED:true}
nyaa.enabled=${NYAA_ENABLED:true}
nyaa.base-url=${NYAA_BASE_URL:https://nyaa.si}
jikan.api=${JIKAN_API:https://api.jikan.moe/v4}
anime.latino.fallback.enabled=${ANIME_LATINO_FALLBACK_ENABLED:true}
anime.latino.fallback.providers=${ANIME_LATINO_FALLBACK_PROVIDERS:jkanime,latanime,monoschinos,tioanime,animefenix,animeflv,consumet,nyaa}
endpoint.ffmpeg=${access}/ffmpeg
endpoint.archive=${access}/archive
endpoint.upload=${access}/upload
ffmpeg.work-dir=${lamovie.download-dir}
ffmpeg.timeout-minutes=120
upload.ssh.host=${UPLOAD_SSH_HOST:192.168.0.254}
upload.ssh.user=${UPLOAD_SSH_USER:sh4dow-server}
upload.ssh.remote-path=${UPLOAD_SSH_REMOTE_PATH:/media/sh4dow-server/Miteve/stream/}
upload.ssh.port=${UPLOAD_SSH_PORT:22}
upload.ssh.password=${UPLOAD_SSH_PASSWORD:${MITEVE_SERVER_PASSWORD:${SSH_PASSWORD:}}}
upload.ssh.timeout-minutes=30
spring.mvc.async.request-timeout=3600000
server.tomcat.connection-timeout=3600000
# Domain
ip.domain=${IP_DOMAIN}