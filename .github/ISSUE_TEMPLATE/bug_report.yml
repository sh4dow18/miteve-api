name: "🐛 Reportar Error"
description: "Reportar un bug o error en MiTeVe-API"
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un bug. Por favor completa la información para ayudarnos a reproducirlo.

  - type: textarea
    id: description
    attributes:
      label: "Descripción"
      description: "Descripción detallada del bug"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Pasos para reproducir"
      description: "Pasos para reproducir el error"
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Ver error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Comportamiento esperado"
      description: "Qué debería pasar"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Comportamiento actual"
      description: "Qué pasa actualmente. Indica método HTTP, path new-api/..., status y body de respuesta"
      placeholder: |
        Método: GET
        Path: new-api/contents/abc123
        Status: 500
        Body:
        ```json
        {
          "status": "INTERNAL_SERVER_ERROR",
          "message": "..."
        }
        ```
    validations:
      required: true

  - type: checkboxes
    id: objetivo
    attributes:
      label: "Objetivo"
      description: "Área(s) / objetivo(s) afectado(s). Selecciona uno o varios."
      options:
        - label: "Auth"
        - label: "Contents"
        - label: "Seasons"
        - label: "Episodes"
        - label: "Containers"
        - label: "Users"
        - label: "Profiles"
        - label: "Scrape"
        - label: "Ffmpeg"
        - label: "Upload"
        - label: "DB"
        - label: "General"
    validations:
      required: true

  - type: dropdown
    id: reportado_por
    attributes:
      label: "Reportado por"
      description: "¿Quién reporta el issue?"
      options:
        - MiTeVe Team
        - QA
        - Usuario
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "Capturas / Logs"
      description: "Agregar screenshots, logs o evidencia (stacktrace, respuesta de ErrorHandler)"
    validations:
      required: true
